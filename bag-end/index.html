<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Bag End</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0805;
      touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    /* Touch controls (shown only on coarse pointers / ?touch=1) */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 3;
      font-family: 'EB Garamond', Georgia, serif; }
    #touch.hidden { display: none; }
    #joy {
      position: absolute; left: calc(20px + env(safe-area-inset-left));
      bottom: calc(24px + env(safe-area-inset-bottom));
      width: 128px; height: 128px; border-radius: 50%;
      background: rgba(232, 220, 192, 0.08); border: 1.5px solid rgba(232, 220, 192, 0.3);
      pointer-events: auto; touch-action: none;
    }
    #joy-nub {
      position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
      margin: -26px 0 0 -26px; border-radius: 50%;
      background: rgba(232, 220, 192, 0.28); border: 1.5px solid rgba(232, 220, 192, 0.5);
    }
    #tbtns {
      position: absolute; right: calc(18px + env(safe-area-inset-right));
      bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }
    #tbtns button {
      pointer-events: auto; touch-action: none;
      font-family: inherit; font-size: 17px; letter-spacing: 0.03em;
      color: #e8dcc0; background: rgba(30, 22, 12, 0.72);
      border: 1.5px solid rgba(232, 220, 192, 0.45); border-radius: 22px;
      padding: 11px 20px; max-width: 62vw;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #tbtns button:active { background: rgba(122, 148, 85, 0.5); }
    #tbtns button.hidden { display: none; }
    #tb-interact { font-size: 19px; border-color: rgba(201, 162, 74, 0.7); }

    :root {
      --parchment: #e8dcc0;
      --ink: #3a2e1e;
      --accent: #7a9455;
    }

    #ui { position: fixed; inset: 0; pointer-events: none; font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; }

    /* Crosshair */
    #crosshair {
      position: absolute; left: 50%; top: 50%; width: 5px; height: 5px;
      transform: translate(-50%, -50%);
      border-radius: 50%; background: rgba(232, 220, 192, 0.55);
      box-shadow: 0 0 3px rgba(0,0,0,0.7);
      transition: transform 0.12s ease, background 0.12s ease;
    }
    #crosshair.active { transform: translate(-50%, -50%) scale(1.7); background: rgba(255, 236, 180, 0.9); }

    /* Interaction prompt */
    #prompt {
      position: absolute; left: 50%; top: 56%; transform: translateX(-50%);
      color: var(--parchment); font-size: 19px; letter-spacing: 0.03em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.5);
      opacity: 0; transition: opacity 0.15s ease;
    }
    #prompt.visible { opacity: 1; }
    #prompt kbd {
      font-family: inherit; font-style: italic; border: 1px solid rgba(232,220,192,0.5);
      border-radius: 4px; padding: 0 7px; margin-right: 8px; font-size: 17px;
    }

    /* Flavor toast */
    #toast {
      position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
      color: var(--parchment); font-size: 21px; font-style: italic; text-align: center;
      max-width: 60ch; text-shadow: 0 1px 5px rgba(0,0,0,0.95);
      opacity: 0; transition: opacity 0.5s ease;
    }
    #toast.visible { opacity: 0.95; }

    /* Start overlay */
    #start {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at center, #1a1208 0%, #0a0805 75%);
      color: var(--parchment); cursor: pointer; pointer-events: auto;
      transition: opacity 1.2s ease; z-index: 10;
      font-family: 'EB Garamond', Georgia, serif;
    }
    #start.hidden { opacity: 0; pointer-events: none; }
    #start h1 { font-size: 54px; font-weight: normal; letter-spacing: 0.12em; }
    #start .quote { font-style: italic; font-size: 20px; opacity: 0.8; max-width: 46ch; text-align: center; line-height: 1.5; }
    #start .hint { margin-top: 26px; font-size: 16px; opacity: 0.55; letter-spacing: 0.08em; }
    #start .keys { font-size: 14px; opacity: 0.45; letter-spacing: 0.05em; }
    #start .loadline { margin-top: 14px; font-size: 13px; font-style: italic; opacity: 0.4; letter-spacing: 0.06em; min-height: 1.2em; }

    /* Reader overlay (book / letters) */
    #reader {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(5, 4, 2, 0.55); pointer-events: auto; z-index: 5;
    }
    #reader.visible { display: flex; }
    #reader .page {
      background: linear-gradient(160deg, #efe4c8 0%, #e2d4b0 60%, #d8c89e 100%);
      color: var(--ink); width: min(560px, 86vw); max-height: 78vh; overflow-y: auto;
      padding: 52px 58px; border-radius: 3px;
      box-shadow: 0 12px 60px rgba(0,0,0,0.8), inset 0 0 60px rgba(120, 90, 40, 0.18);
      font-size: 19px; line-height: 1.65;
    }
    #reader .page h2 { font-weight: normal; font-size: 27px; margin-bottom: 0.8em; text-align: center; letter-spacing: 0.04em; }
    #reader .page p { margin-bottom: 0.9em; }
    #reader .page .sig { text-align: right; font-style: italic; margin-top: 1.4em; }
    #reader .hint { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
      color: var(--parchment); font-size: 15px; opacity: 0.6; }

    /* Vignette for reading & subtle frame */
    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.45);
    }
  </style>
  <script type="module" crossorigin src="./assets/index-x9W8r3jK.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="prompt"><kbd>E</kbd><span id="prompt-text"></span></div>
    <div id="toast"></div>
  </div>
  <div id="reader"><div class="page" id="reader-page"></div><div class="hint">E or Esc — put it down</div></div>
  <div id="touch" class="hidden">
    <div id="joy"><div id="joy-nub"></div></div>
    <div id="tbtns">
      <button id="tb-interact" class="hidden"></button>
      <button id="tb-inspect" class="hidden">look closer</button>
      <button id="tb-drop" class="hidden">put down</button>
      <button id="tb-exit" class="hidden">stand up</button>
    </div>
  </div>
  <div id="start">
    <h1>BAG END</h1>
    <div class="quote">In a hole in the ground there lived a hobbit… and that means comfort.</div>
    <div class="hint">CLICK TO STEP INSIDE</div>
    <div class="keys">WASD walk &nbsp;·&nbsp; mouse or arrows look &nbsp;·&nbsp; E interact &nbsp;·&nbsp; R inspect &nbsp;·&nbsp; Q drop</div>
    <div class="loadline" id="loadline"></div>
  </div>
</body>
</html>
